<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>MPKT V2 2026 - SUPABASE ONLINE</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f4f8;
    color:#20242a;
}

.header{
    background:#a81717;
    color:white;
    padding:18px 15px 15px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.header h1{
    margin:0;
    font-size:26px;
    font-weight:800;
}

.header .sub{
    margin-top:5px;
    font-size:15px;
}

.online{
    display:inline-block;
    margin-top:9px;
    padding:6px 15px;
    border-radius:20px;
    background:#20a957;
    color:white;
    font-weight:bold;
    font-size:13px;
}

.offline{
    background:#777;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:12px;
}

.card{
    background:white;
    border-radius:14px;
    padding:15px;
    margin-bottom:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.grid-summary{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.summary{
    border:1px solid #d9dde2;
    border-radius:10px;
    padding:12px;
    text-align:center;
}

.summary .number{
    font-size:24px;
    font-weight:800;
    color:#1267b1;
}

.summary.minus .number{
    color:#c5303b;
}

.summary .label{
    margin-top:4px;
    font-size:14px;
    font-weight:bold;
    color:#555;
}

.total{
    margin-top:10px;
    padding:17px;
    border-radius:10px;
    background:#202832;
    color:white;
    text-align:center;
}

.total-title{
    font-weight:bold;
    font-size:14px;
}

.total-value{
    margin-top:6px;
    font-size:27px;
    font-weight:900;
}

.total-value.minus{
    color:#ef5350;
}

.total-value.plus{
    color:#43d17c;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin:10px 0 5px;
}

input,
select,
button{
    font-family:inherit;
}

input,
select{
    width:100%;
    min-height:48px;
    border:1px solid #d3d7dc;
    border-radius:9px;
    padding:0 13px;
    font-size:15px;
    background:white;
    outline:none;
}

input:focus,
select:focus{
    border-color:#a81717;
    box-shadow:0 0 0 2px rgba(168,23,23,.08);
}

.filter-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.btn-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:10px;
}

button{
    min-height:46px;
    border:0;
    border-radius:9px;
    padding:10px 13px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.btn-primary{
    background:#a81717;
    color:white;
}

.btn-print{
    background:#1565c0;
    color:white;
}

.btn-refresh{
    background:#edf0f3;
    color:#222;
}

.btn-edit{
    background:#087ee5;
    color:white;
}

.btn-delete{
    background:#df2939;
    color:white;
}

.btn-cancel{
    background:#777;
    color:white;
}

.table-wrap{
    overflow-x:auto;
    border:1px solid #d9dde2;
    border-radius:10px;
}

table{
    width:100%;
    min-width:650px;
    border-collapse:collapse;
}

th{
    background:#f0f2f4;
    padding:13px 9px;
    font-size:14px;
    font-weight:800;
    white-space:nowrap;
}

td{
    border-top:1px solid #e1e4e7;
    padding:10px 8px;
    font-size:14px;
    text-align:center;
    white-space:nowrap;
}

td:first-child{
    text-align:left;
}

.minus-text{
    color:#c5303b;
    font-weight:800;
}

.plus-text{
    color:#16864a;
    font-weight:800;
}

.zero-text{
    color:#555;
    font-weight:800;
}

.badge{
    display:inline-block;
    padding:7px 12px;
    border-radius:9px;
    font-size:12px;
    font-weight:800;
}

.badge-minus{
    background:#f8d7da;
    color:#8b1e2d;
}

.badge-plus{
    background:#d8f3df;
    color:#146c35;
}

.badge-zero{
    background:#e5e7eb;
    color:#444;
}

.action{
    display:flex;
    justify-content:center;
    gap:5px;
}

.action button{
    min-height:38px;
    width:42px;
    padding:5px;
    font-size:18px;
}

.status{
    text-align:center;
    padding:10px;
    font-size:13px;
    font-weight:bold;
}

.empty{
    text-align:center;
    padding:30px 10px;
    color:#777;
}

.modal{
    display:none;
    position:fixed;
    z-index:9999;
    inset:0;
    background:rgba(0,0,0,.55);
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    border-radius:15px;
    padding:18px;
}

.modal-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:12px;
}

.small{
    color:#777;
    font-size:12px;
}

/* PRINT */
@media print{

    @page{
        size:A4 portrait;
        margin:10mm;
    }

    body{
        background:white;
        color:#000;
    }

    .header{
        background:white !important;
        color:#000;
        box-shadow:none;
        border-bottom:2px solid #000;
        padding:8px;
    }

    .header h1{
        font-size:20px;
    }

    .header .sub{
        font-size:12px;
    }

    .online{
        display:none;
    }

    .container{
        max-width:none;
        padding:0;
    }

    .no-print,
    .btn-row,
    .action,
    .filter-card,
    .status{
        display:none !important;
    }

    .card{
        box-shadow:none;
        border:0;
        margin:0 0 8px;
        padding:5px;
    }

    .grid-summary{
        gap:5px;
    }

    .summary{
        padding:7px;
        border:1px solid #999;
    }

    .summary .number{
        font-size:18px;
    }

    .summary .label{
        font-size:10px;
    }

    .total{
        padding:8px;
        margin-top:5px;
        background:#eee !important;
        color:#000;
        border:1px solid #999;
    }

    .total-value{
        font-size:20px;
    }

    table{
        min-width:0;
        width:100%;
    }

    th,
    td{
        padding:6px 4px;
        font-size:10px;
    }

    .badge{
        padding:3px 6px;
        font-size:9px;
    }

    .print-title{
        display:block !important;
    }
}

.print-title{
    display:none;
}
</style>
</head>

<body>

<div class="header">
    <h1>KODE TOKO: <span id="headerKodeToko">I004</span></h1>
    <div class="sub">🏪 MPKT V.2 2026 - SUPABASE ONLINE</div>
    <div id="onlineBadge" class="online">Menghubungkan...</div>
</div>

<div class="container">

    <div class="card no-print">

        <label>Kode Toko</label>
        <input
            id="kodeToko"
            type="text"
            value="I004"
            placeholder="Masukkan kode toko">

        <div class="btn-row">
            <button class="btn-primary" onclick="connectStore()">
                🔗 Hubungkan
            </button>

            <button class="btn-refresh" onclick="loadData()">
                🔄 Refresh
            </button>
        </div>

    </div>

    <div class="card">

        <div class="grid-summary">

            <div class="summary minus">
                <div class="number" id="jumlahMinus">0</div>
                <div class="label">Rak Minus</div>
            </div>

            <div class="summary">
                <div class="number" id="jumlahPlus">0</div>
                <div class="label">Rak Plus</div>
            </div>

            <div class="summary">
                <div class="number" id="jumlahNol">0</div>
                <div class="label">Rak Nol</div>
            </div>

            <div class="summary">
                <div class="number" id="jumlahData">0</div>
                <div class="label">Total Data</div>
            </div>

        </div>

        <div class="total">
            <div class="total-title">Total Selisih Rupiah</div>
            <div id="totalSelisih" class="total-value">Rp 0</div>
        </div>

    </div>

    <!-- FILTER -->
    <div class="card filter-card no-print">

        <label>🔎 Cari Rak / PIC</label>
        <input
            id="searchInput"
            type="text"
            placeholder="Cari rak/PIC..."
            oninput="applyFilters()">

        <div class="filter-grid">

            <div>
                <label>Filter Status</label>
                <select id="statusFilter" onchange="applyFilters()">
                    <option value="all">Tampil Semua</option>
                    <option value="plus">Hanya Plus</option>
                    <option value="minus">Hanya Minus</option>
                    <option value="zero">Hanya Nol</option>
                </select>
            </div>

            <div>
                <label>Urutan</label>
                <select id="sortFilter" onchange="applyFilters()">
                    <option value="normal">Urutan Normal</option>
                    <option value="minus-big">🔥 Minus Terbesar</option>
                    <option value="minus-small">Minus Terkecil</option>
                    <option value="plus-big">Plus Terbesar</option>
                    <option value="plus-small">Plus Terkecil</option>
                </select>
            </div>

        </div>

        <div class="btn-row">

            <button class="btn-print" onclick="printReport()">
                🖨️ Cetak Laporan
            </button>

            <button class="btn-refresh" onclick="resetFilter()">
                ♻️ Reset Filter
            </button>

        </div>

    </div>

    <!-- PRINT TITLE -->
    <div class="print-title">
        <h2>LAPORAN HASIL STOCK OPNAME</h2>
        <div>
            Kode Toko:
            <strong id="printKodeToko">I004</strong>
        </div>
        <div id="printTanggal"></div>
    </div>

    <div class="card">

        <div id="statusMessage" class="status">
            Mengambil data...
        </div>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Rak</th>
                        <th>PIC</th>
                        <th>Tanggal</th>
                        <th>Selisih</th>
                        <th>Status</th>
                        <th class="no-print">Aksi</th>
                    </tr>
                </thead>

                <tbody id="dataBody"></tbody>

            </table>

        </div>

        <div id="emptyMessage" class="empty" style="display:none">
            Tidak ada data yang sesuai.
        </div>

    </div>

</div>


<!-- MODAL EDIT -->
<div id="editModal" class="modal">

    <div class="modal-box">

        <div class="modal-title">
            ✏️ Edit Data SO
        </div>

        <input type="hidden" id="editId">

        <label>Rak</label>
        <input id="editRak" type="text">

        <label>PIC</label>
        <input id="editPic" type="text">

        <label>Tanggal</label>
        <input id="editTgl" type="date">

        <label>Selisih</label>
        <input id="editVal" type="number" step="1">

        <label>Keterangan</label>
        <input id="editKet" type="text">

        <div class="btn-row">
            <button class="btn-primary" onclick="saveEdit()">
                💾 Simpan
            </button>

            <button class="btn-cancel" onclick="closeModal()">
                Batal
            </button>
        </div>

    </div>

</div>


<script>

/* =========================================================
   KONFIGURASI SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://cnicfxkffpmfvphlgqmi.supabase.co/rest/v1";

const SUPABASE_KEY =
    "sb_publishable_MUoal40LpsRgVH8rvmrYNA_xXlsW1-r";

const TABLE = "so_data";


/* =========================================================
   VARIABEL
   ========================================================= */

let allData = [];
let filteredData = [];
let autoRefresh = null;


/* =========================================================
   HEADER SUPABASE
   ========================================================= */

function supabaseHeaders(){

    return {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
    };

}


/* =========================================================
   FORMAT RUPIAH
   ========================================================= */

function formatRupiah(value){

    const number = Number(value) || 0;

    const sign = number < 0 ? "- " : "";

    return sign +
        "Rp " +
        Math.abs(number).toLocaleString("id-ID");

}


/* =========================================================
   FORMAT TANGGAL
   ========================================================= */

function formatTanggal(value){

    if(!value) return "-";

    const d = new Date(value);

    if(isNaN(d.getTime())) return value;

    return d.toLocaleDateString("id-ID",{
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
    });

}


/* =========================================================
   STATUS
   ========================================================= */

function getStatus(value){

    const n = Number(value) || 0;

    if(n < 0) return "minus";

    if(n > 0) return "plus";

    return "zero";

}


/* =========================================================
   CONNECT
   ========================================================= */

async function connectStore(){

    const kode =
        document.getElementById("kodeToko")
        .value
        .trim()
        .toUpperCase();

    if(!kode){

        alert("Masukkan kode toko terlebih dahulu.");

        return;
    }

    localStorage.setItem(
        "kode_toko",
        kode
    );

    document.getElementById(
        "headerKodeToko"
    ).textContent = kode;

    document.getElementById(
        "printKodeToko"
    ).textContent = kode;

    await loadData();

}


/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadData(){

    const kode =
        document.getElementById("kodeToko")
        .value
        .trim()
        .toUpperCase();

    if(!kode){

        setConnection(false);

        return;
    }

    setStatus(
        "Mengambil data dari Supabase..."
    );

    try{

        const url =
            SUPABASE_URL +
            "/" +
            TABLE +
            "?kode_toko=eq." +
            encodeURIComponent(kode) +
            "&select=id,kode_toko,rak,pic,tgl,val,ket,waktu_update" +
            "&order=tgl.asc,rak.asc";

        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    headers:supabaseHeaders()
                }
            );

        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(
                response.status +
                " " +
                errorText
            );

        }

        allData =
            await response.json();

        setConnection(true);

        applyFilters();

        setStatus(
            "Data tersimpan di Supabase • " +
            allData.length +
            " data"
        );

    }catch(error){

        console.error(error);

        setConnection(false);

        setStatus(
            "Gagal mengambil data Supabase: " +
            error.message
        );

    }

}


/* =========================================================
   CONNECTION BADGE
   ========================================================= */

function setConnection(online){

    const badge =
        document.getElementById(
            "onlineBadge"
        );

    if(online){

        badge.textContent =
            "Online & Tersinkronisasi";

        badge.classList.remove("offline");

    }else{

        badge.textContent =
            "Offline / Gagal Terhubung";

        badge.classList.add("offline");

    }

}


/* =========================================================
   FILTER
   ========================================================= */

function applyFilters(){

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();

    const status =
        document.getElementById(
            "statusFilter"
        ).value;

    const sort =
        document.getElementById(
            "sortFilter"
        ).value;


    filteredData =
        allData.filter(row => {

            const rak =
                String(row.rak || "")
                .toLowerCase();

            const pic =
                String(row.pic || "")
                .toLowerCase();

            const matchesSearch =
                !search ||
                rak.includes(search) ||
                pic.includes(search);

            const rowStatus =
                getStatus(row.val);

            const matchesStatus =
                status === "all" ||
                rowStatus === status;

            return (
                matchesSearch &&
                matchesStatus
            );

        });


    /* SORT */

    if(sort === "minus-big"){

        filteredData.sort(
            (a,b) =>
                Number(a.val || 0) -
                Number(b.val || 0)
        );

    }

    else if(sort === "minus-small"){

        filteredData.sort(
            (a,b) =>
                Math.abs(Number(b.val || 0)) -
                Math.abs(Number(a.val || 0))
        );

    }

    else if(sort === "plus-big"){

        filteredData.sort(
            (a,b) =>
                Number(b.val || 0) -
                Number(a.val || 0)
        );

    }

    else if(sort === "plus-small"){

        filteredData.sort(
            (a,b) =>
                Number(a.val || 0) -
                Number(b.val || 0)
        );

    }


    renderTable();

}


/* =========================================================
   RENDER TABLE
   ========================================================= */

function renderTable(){

    const body =
        document.getElementById(
            "dataBody"
        );

    body.innerHTML = "";

    if(filteredData.length === 0){

        document.getElementById(
            "emptyMessage"
        ).style.display = "block";

    }else{

        document.getElementById(
            "emptyMessage"
        ).style.display = "none";

    }


    filteredData.forEach(row => {

        const value =
            Number(row.val) || 0;

        const status =
            getStatus(value);

        let statusHTML = "";

        if(status === "minus"){

            statusHTML =
                '<span class="badge badge-minus">MINUS</span>';

        }

        else if(status === "plus"){

            statusHTML =
                '<span class="badge badge-plus">PLUS</span>';

        }

        else{

            statusHTML =
                '<span class="badge badge-zero">NOL</span>';

        }


        let valueClass =
            status === "minus"
            ? "minus-text"
            : status === "plus"
            ? "plus-text"
            : "zero-text";


        const tr =
            document.createElement("tr");


        tr.innerHTML = `

            <td>
                <strong>
                    ${escapeHTML(row.rak || "-")}
                </strong>
            </td>

            <td>
                ${escapeHTML(row.pic || "-")}
            </td>

            <td>
                ${formatTanggal(row.tgl)}
            </td>

            <td class="${valueClass}">
                ${formatRupiah(value)}
            </td>

            <td>
                ${statusHTML}
            </td>

            <td class="action no-print">

                <button
                    class="btn-edit"
                    onclick="openEdit('${row.id}')">
                    ✏️
                </button>

                <button
                    class="btn-delete"
                    onclick="deleteData('${row.id}')">
                    🗑️
                </button>

            </td>
        `;


        body.appendChild(tr);

    });


    updateSummary();

}


/* =========================================================
   SUMMARY
   ========================================================= */

function updateSummary(){

    const minus =
        allData.filter(
            x => Number(x.val || 0) < 0
        ).length;

    const plus =
        allData.filter(
            x => Number(x.val || 0) > 0
        ).length;

    const zero =
        allData.filter(
            x => Number(x.val || 0) === 0
        ).length;


    const total =
        allData.reduce(
            (sum,row) =>
                sum + (Number(row.val) || 0),
            0
        );


    document.getElementById(
        "jumlahMinus"
    ).textContent = minus;

    document.getElementById(
        "jumlahPlus"
    ).textContent = plus;

    document.getElementById(
        "jumlahNol"
    ).textContent = zero;

    document.getElementById(
        "jumlahData"
    ).textContent = allData.length;


    const totalElement =
        document.getElementById(
            "totalSelisih"
        );

    totalElement.textContent =
        formatRupiah(total);


    totalElement.classList.remove(
        "minus",
        "plus"
    );


    if(total < 0){

        totalElement.classList.add("minus");

    }else if(total > 0){

        totalElement.classList.add("plus");

    }

}


/* =========================================================
   EDIT
   ========================================================= */

function openEdit(id){

    const row =
        allData.find(
            x => String(x.id) === String(id)
        );

    if(!row){

        alert("Data tidak ditemukan.");

        return;
    }


    document.getElementById(
        "editId"
    ).value = row.id;

    document.getElementById(
        "editRak"
    ).value = row.rak || "";

    document.getElementById(
        "editPic"
    ).value = row.pic || "";

    document.getElementById(
        "editTgl"
    ).value =
        row.tgl
        ? String(row.tgl).substring(0,10)
        : "";

    document.getElementById(
        "editVal"
    ).value = row.val ?? 0;

    document.getElementById(
        "editKet"
    ).value = row.ket || "";


    document.getElementById(
        "editModal"
    ).classList.add("show");

}


/* =========================================================
   CLOSE MODAL
   ========================================================= */

function closeModal(){

    document.getElementById(
        "editModal"
    ).classList.remove("show");

}


/* =========================================================
   SAVE EDIT
   ========================================================= */

async function saveEdit(){

    const id =
        document.getElementById(
            "editId"
        ).value;

    const data = {

        rak:
            document.getElementById(
                "editRak"
            ).value.trim(),

        pic:
            document.getElementById(
                "editPic"
            ).value.trim(),

        tgl:
            document.getElementById(
                "editTgl"
            ).value,

        val:
            Number(
                document.getElementById(
                    "editVal"
                ).value
            ) || 0,

        ket:
            document.getElementById(
                "editKet"
            ).value.trim(),

        waktu_update:
            new Date().toISOString()

    };


    try{

        const url =
            SUPABASE_URL +
            "/" +
            TABLE +
            "?id=eq." +
            encodeURIComponent(id);


        const response =
            await fetch(
                url,
                {
                    method:"PATCH",
                    headers:supabaseHeaders(),
                    body:JSON.stringify(data)
                }
            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        closeModal();

        await loadData();

        alert("Data berhasil diperbarui.");

    }catch(error){

        console.error(error);

        alert(
            "Gagal memperbarui data:\n" +
            error.message
        );

    }

}


/* =========================================================
   DELETE
   ========================================================= */

async function deleteData(id){

    const row =
        allData.find(
            x => String(x.id) === String(id)
        );


    if(!row) return;


    const yakin =
        confirm(
            "Hapus data rak " +
            (row.rak || "") +
            "?"
        );


    if(!yakin) return;


    try{

        const url =
            SUPABASE_URL +
            "/" +
            TABLE +
            "?id=eq." +
            encodeURIComponent(id);


        const response =
            await fetch(
                url,
                {
                    method:"DELETE",
                    headers:supabaseHeaders()
                }
            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        await loadData();

    }catch(error){

        console.error(error);

        alert(
            "Gagal menghapus data:\n" +
            error.message
        );

    }

}

    document.getElementById(

/* =========================================================
   CETAK LAPORAN
   ========================================================= */

function printReport(){

    if(filteredData.length === 0){

        alert(
            "Tidak ada data yang bisa dicetak."
        );

        return;
    }


    const now =
        new Date();


    document.getElementById(
        "printTanggal"
    ).textContent =
        "Dicetak: " +
        now.toLocaleDateString(
            "id-ID",
            {
                day:"2-digit",
                month:"long",
                year:"numeric"
            }
        ) +
        " " +
        now.toLocaleTimeString(
            "id-ID",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    window.print();

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   STATUS MESSAGE
   ========================================================= */

function setStatus(message){

    document.getElementById(
        "statusMessage"
    ).textContent = message;

}
