<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MPKT SO - Portal Aplikasi</title>
<style>
:root{
  --red:#c8102e;--red-dark:#9f1239;--ink:#17202a;--muted:#667085;--line:#e6e9ee;
  --bg:#f5f7fa;--card:#ffffff;--soft:#f8fafc;--shadow:0 10px 30px rgba(16,24,40,.07)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef1f5;color:var(--ink);overflow:hidden}
body{display:flex;justify-content:center}
.portal{width:100%;max-width:none;height:100%;background:var(--bg);position:relative;overflow:hidden}
.home{height:100%;overflow:auto;padding:18px 16px 104px;scroll-behavior:smooth}
.search{height:56px;border:1px solid rgba(16,24,40,.08);border-radius:16px;display:flex;align-items:center;padding:0 16px;background:rgba(255,255,255,.96);box-shadow:0 8px 24px rgba(16,24,40,.07);margin-bottom:18px;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.search:focus-within{border-color:#e11d48;box-shadow:0 0 0 4px rgba(200,16,46,.08),0 8px 24px rgba(16,24,40,.07)}
.search input{border:0;outline:0;width:100%;font-size:16px;color:var(--ink);background:transparent}
.search input::placeholder{color:#98a2b3}.search span{font-size:25px;color:#475467;margin-left:8px}
.banner{height:158px;border-radius:22px;background:linear-gradient(120deg,#7f1025 0%,#c8102e 52%,#e83b3b 100%);position:relative;overflow:hidden;margin-bottom:28px;box-shadow:0 12px 28px rgba(159,18,57,.18)}
.banner:before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.18),transparent 32%),linear-gradient(135deg,transparent 35%,rgba(255,255,255,.08) 35%,transparent 58%);transform:rotate(-5deg)}
.banner:after{content:"";position:absolute;right:-70px;bottom:-100px;width:260px;height:260px;border:50px solid rgba(255,255,255,.06);border-radius:50%}
.bannerText{position:absolute;left:22px;bottom:20px;color:#fff;font-weight:800;font-size:17px;letter-spacing:.7px;z-index:1}
.bannerText:before{content:"";display:block;width:34px;height:3px;background:#fff;border-radius:99px;margin-bottom:9px;opacity:.9}
.apps{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;padding:0 2px}
.app-card{border:1px solid var(--line);background:var(--card);border-radius:20px;text-align:center;cursor:pointer;padding:18px 10px 17px;min-width:0;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.app-card:active{transform:scale(.98)}.app-card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(16,24,40,.10);border-color:#d7dce3}
.app-icon{width:92px;height:92px;margin:auto;border-radius:28px;background:linear-gradient(145deg,#e11d48,#9f1239);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 20px rgba(159,18,57,.18);position:relative;overflow:hidden}
.app-icon:before{content:"";position:absolute;width:68px;height:68px;border:1px solid rgba(255,255,255,.18);border-radius:20px;transform:rotate(10deg)}
.app-icon:after{content:"";position:absolute;right:-10px;bottom:-14px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.08)}
.icon-symbol{font-size:42px;z-index:2;color:#fff;font-weight:800;text-shadow:0 2px 6px rgba(0,0,0,.18)}
.app-name{font-size:14px;font-weight:750;margin-top:14px;line-height:1.3;color:#101828}.app-desc{font-size:12px;color:#667085;margin-top:5px;line-height:1.35}
.dots{display:flex;justify-content:center;gap:9px;margin:32px 0 12px}.dot{width:8px;height:8px;border-radius:50%;background:#d0d5dd}.dot.active{background:#c8102e;width:22px;border-radius:99px}
.bottom{position:fixed;bottom:0;left:0;transform:none;width:100%;max-width:none;height:78px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:1000;pointer-events:auto;box-shadow:0 -8px 24px rgba(16,24,40,.06);backdrop-filter:blur(12px)}
.navbtn{flex:1;border:0;background:transparent;font-size:11px;color:#667085;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;font-weight:650}.navicon{font-size:26px;line-height:1}.navbtn.active{color:#c8102e}
.viewer{display:none;position:absolute;inset:0;background:#f5f7fa;z-index:500}.viewer.active{display:block}
.viewerbar{height:58px;background:rgba(255,255,255,.96);color:#17202a;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);box-shadow:0 5px 18px rgba(16,24,40,.06);position:relative;z-index:2;backdrop-filter:blur(12px)}
.back{border:0;background:#f2f4f7;color:#344054;border-radius:12px;font-size:27px;width:40px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center}.back:active{transform:scale(.96)}
.viewer-title{font-weight:750;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frame-wrap{position:absolute;left:0;right:0;top:58px;bottom:78px;background:#f5f7fa}iframe{width:100%;height:100%;border:0;display:block;background:#f5f7fa}.empty{display:none;text-align:center;color:#667085;padding:40px 10px;font-size:13px}
@media(max-width:430px){.home{padding:14px 12px 104px}.banner{height:142px}.app-icon{width:82px;height:82px;border-radius:24px}.icon-symbol{font-size:36px}.apps{gap:12px}.app-card{padding:15px 8px}.app-name{font-size:13px}}
</style>

<style id="desktop-responsive-fix">
@media (min-width: 769px) {
  .home {
    padding-left: clamp(28px, 4vw, 64px);
    padding-right: clamp(28px, 4vw, 64px);
  }

  .home > * {
    max-width: 1400px;
    margin-left: auto;
    margin-right: auto;
  }

  .apps {
    grid-template-columns: repeat(4, minmax(180px, 1fr));
    gap: 22px;
  }

  .app-card {
    padding: 24px 16px 20px;
  }

  .app-icon {
    width: 104px;
    height: 104px;
  }

  .viewer-titlebar {
    padding-left: 24px !important;
    padding-right: 24px !important;
  }
}
</style>


<style id="global-chat-outer-css">
.chat-screen{position:fixed;inset:0;background:var(--bg);z-index:2000;display:none;flex-direction:column;padding-bottom:86px}
.chat-screen.active{display:flex}
.chat-header{background:linear-gradient(135deg,#9f1239,#e11d48);color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 8px 24px rgba(159,18,57,.18)}
.chat-head-title{font-weight:800;font-size:18px}.chat-head-sub{font-size:12px;opacity:.9;margin-top:3px}.chat-store{background:rgba(255,255,255,.16);border-radius:999px;padding:7px 10px;font-size:12px;white-space:nowrap}
.chat-messages{flex:1;overflow:auto;padding:16px;background:#f5f7fa}.chat-empty{text-align:center;color:#98a2b3;padding:60px 20px}
.chat-row{display:flex;margin:7px 0}.chat-row.mine{justify-content:flex-end}.chat-bubble{max-width:min(78%,650px);background:#fff;border:1px solid #e4e7ec;border-radius:15px 15px 15px 4px;padding:9px 11px;box-shadow:0 3px 10px rgba(16,24,40,.05)}.chat-row.mine .chat-bubble{background:#ecfdf3;border-color:#b7ebc9;border-radius:15px 15px 4px 15px}.chat-name{font-size:11px;font-weight:800;color:#c8102e;margin-bottom:3px}.chat-row.mine .chat-name{color:#15803d}.chat-text{font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.chat-time{font-size:10px;color:#98a2b3;text-align:right;margin-top:4px}
.chat-compose{background:#fff;border-top:1px solid #e4e7ec;padding:10px;display:flex;gap:8px}.chat-compose input{flex:1;min-width:0;border:1px solid #d0d5dd;border-radius:12px;padding:11px 12px;font-size:14px;outline:0}.chat-compose input:focus{border-color:#c8102e;box-shadow:0 0 0 3px rgba(200,16,46,.08)}.chat-send{border:0;border-radius:12px;padding:0 18px;background:#c8102e;color:#fff;font-weight:800}.chat-send:disabled{opacity:.55}
.chat-close{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 11px;font-size:18px;line-height:1;cursor:pointer}.chat-badge{display:none;position:absolute;top:5px;right:12px;background:#e11;color:#fff;border-radius:999px;min-width:16px;height:16px;padding:0 4px;font-size:9px;line-height:16px;text-align:center;font-weight:800}.navbtn.chat-nav{position:relative}
@media(min-width:769px){.chat-screen{padding-bottom:0}.chat-messages{max-width:1100px;width:100%;margin:0 auto}.chat-compose{padding-left:max(10px,calc((100% - 1100px)/2));padding-right:max(10px,calc((100% - 1100px)/2))}}
</style>

</head>
<body>
<div class="portal">
  <section class="home" id="home">
    <div class="search"><input id="searchApp" type="search" placeholder="Cari aplikasi" autocomplete="off"><span>⌕</span></div>
    <div class="banner"><div class="bannerText">MPKT • STOCK OPNAME</div></div>
    <div class="apps" id="apps">
      <button class="app-card" data-search="so rak 979 input stok" onclick="bukaApp('so')">
        <div class="app-icon"><div class="icon-symbol">▣</div></div>
        <div class="app-name">SO Rak 979</div><div class="app-desc">Input Stok / Fisik • Online</div>
      </button>
      <button class="app-card" data-search="monitoring so partial" onclick="bukaApp('monitoring')">
        <div class="app-icon"><div class="icon-symbol">▤</div></div>
        <div class="app-name">Monitoring SO Partial</div><div class="app-desc">Monitoring Hasil SO</div>
      </button>
    </div>
    <div class="empty" id="empty">Aplikasi tidak ditemukan.</div>
    <div class="dots"><span class="dot active"></span><span class="dot"></span></div>
  </section>

  <div class="bottom">
    <button class="navbtn active" onclick="keBeranda()"><span class="navicon">⌂</span><span>Beranda</span></button>
    <button class="navbtn" onclick="fokusPencarian()"><span class="navicon">▦</span><span>Aplikasi</span></button>
    <button class="navbtn chat-nav" onclick="bukaChatGlobal()"><span class="navicon">💬</span><span>Chat</span><b id="chatBadge" class="chat-badge">0</b></button>
  </div>

  <section class="viewer" id="viewer">
    <div class="viewerbar"><button class="back" onclick="tutupApp()">‹</button><div class="viewer-title" id="viewerTitle"></div></div>
    <div class="frame-wrap"><iframe id="appFrame" allow="camera; microphone; geolocation"></iframe></div>
  </section>
</div>

const APP_THEME_CSS = `
@media screen {
  :root{
    --pro-red:#c8102e;--pro-red-dark:#9f1239;--pro-ink:#17202a;--pro-muted:#667085;
    --pro-bg:#f5f7fa;--pro-card:#ffffff;--pro-line:#e4e7ec;--pro-soft:#f8fafc;
  }
  html,body{background:var(--pro-bg)!important;color:var(--pro-ink)!important}
  body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif!important}
  header{background:linear-gradient(120deg,var(--pro-red-dark),var(--pro-red))!important;box-shadow:0 8px 24px rgba(159,18,57,.16)!important;border-bottom:0!important}
  header h1{letter-spacing:.2px!important}
  .wrap,main{background:var(--pro-bg)!important}
  .card{border:1px solid var(--pro-line)!important;border-radius:16px!important;box-shadow:0 8px 24px rgba(16,24,40,.06)!important}
  .card-header{color:var(--pro-red)!important}
  input,select,textarea,.form-control,.search{border-color:#d0d5dd!important;border-radius:10px!important;background:#fff!important;color:var(--pro-ink)!important}
  input:focus,select:focus,textarea:focus,.form-control:focus{border-color:#c8102e!important;box-shadow:0 0 0 3px rgba(200,16,46,.08)!important;outline:none!important}
  button{border-radius:10px!important;transition:transform .15s ease,box-shadow .15s ease!important}
  button:active{transform:translateY(1px)!important}
  .primary,.btn-primary{background:linear-gradient(135deg,#c8102e,#e11d48)!important;box-shadow:0 6px 14px rgba(200,16,46,.18)!important}
  .dark{background:#344054!important}.green,.btn-download-photo{background:#15803d!important}.gray{background:#f2f4f7!important;color:#344054!important;border:1px solid #d0d5dd!important}
  .scanbox input{border:1px solid #cbd5e1!important;box-shadow:none!important}
  .stat .pill,.pill{background:#f8fafc!important;border:1px solid var(--pro-line)!important;color:#475467!important}
  .table-wrap,.table-responsive{border:1px solid var(--pro-line)!important;border-radius:12px!important}
  table{background:#fff!important} th{background:#f8fafc!important;color:#344054!important;border-bottom:1px solid #d0d5dd!important} td{border-bottom:1px solid #eef0f3!important}
  tr.done{background:#f0fdf4!important}
  .custom-select-container,.custom-dropdown-container{z-index:20}
  .dropdown-list,.custom-dropdown-list{border:1px solid #d0d5dd!important;border-radius:12px!important;box-shadow:0 12px 30px rgba(16,24,40,.12)!important}
  .dropdown-item:hover,.custom-dropdown-item:hover{background:#fff1f2!important;color:#9f1239!important}
  .camera-panel{border-radius:16px!important;background:#111827!important}
  .camera-frame{border-color:#fff!important}
  .total-selisih-box{background:linear-gradient(135deg,#1f2937,#344054)!important;border-radius:14px!important;box-shadow:0 8px 20px rgba(16,24,40,.10)!important}
  .stat-so-box{background:#fff!important;border:1px solid var(--pro-line)!important;border-radius:12px!important;box-shadow:0 4px 12px rgba(16,24,40,.04)!important}
  .rak-item{border-bottom:1px solid #eef0f3!important}
  .progress-bar{background:#eaecf0!important;border-radius:99px!important}.progress-fill{background:linear-gradient(90deg,#16a34a,#22c55e)!important}
  .photo-preview img,.photo-thumb{border-color:#d0d5dd!important}
  .error-box{border:1px solid #fecdd3!important}
  .btn-action-sm{border-radius:8px!important}
  nav{background:#fff!important;border-bottom:1px solid var(--pro-line)!important;box-shadow:0 4px 14px rgba(16,24,40,.04)!important}
  .nav-item{color:#475467!important;background:#fff!important;border-bottom:3px solid transparent!important}.nav-item.active,.nav-item:hover{color:var(--pro-red)!important;border-bottom-color:var(--pro-red)!important;background:#fff5f7!important}
}
`;
function applyAppTheme(html){
  return html.replace('</head>', `<style>${APP_THEME_CSS}</style></head>`);
}
const titles={so:'SO Rak 979 - Online',monitoring:'Monitoring SO Partial'};
let activeUrl=null;
function bukaApp(key){
  const frame=document.getElementById('appFrame');
  if(activeUrl){URL.revokeObjectURL(activeUrl);activeUrl=null;}
  const blob=new Blob([applyAppTheme(sources[key])],{type:'text/html;charset=utf-8'});
  activeUrl=URL.createObjectURL(blob);
  frame.src=activeUrl;
  document.getElementById('viewerTitle').textContent=titles[key];
  document.getElementById('viewer').classList.add('active');
}
function tutupApp(){
  document.getElementById('viewer').classList.remove('active');
  const frame=document.getElementById('appFrame');
  frame.src='about:blank';
  if(activeUrl){URL.revokeObjectURL(activeUrl);activeUrl=null;}
}
function keBeranda(){try{tutupChatGlobal()}catch(e){}tutupApp();document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));document.querySelector('.navbtn')?.classList.add('active');window.scrollTo(0,0);document.getElementById('home').scrollTop=0;}
function fokusPencarian(){try{tutupChatGlobal()}catch(e){}tutupApp();document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.navbtn')[1]?.classList.add('active');setTimeout(()=>document.getElementById('searchApp').focus(),80);}
document.getElementById('searchApp').addEventListener('input',function(){
  const q=this.value.toLowerCase().trim();let count=0;
  document.querySelectorAll('.app-card').forEach(c=>{const ok=!q||c.dataset.search.includes(q);c.style.display=ok?'':'none';if(ok)count++;});
  document.getElementById('empty').style.display=count?'none':'block';
});
</script>

<section id="chatScreen" class="chat-screen" aria-label="Chat Global">
  <div class="chat-header">
    <div>
      <div class="chat-head-title">💬 Chat Global</div>

<script id="global-chat-outer-js">
(function(){
  const CHAT_TABLE='global_chat';
  const CHAT_URL='https://cnicfxkffpmfvphlgqmi.supabase.co/rest/v1';
  const CHAT_KEY='sb_publishable_MUoal40LpsRgVH8rvmrYNA_xXlsW1-r';
  let chatTimer=null, chatOpen=false, lastChatIds='';
  const headers=()=>({apikey:CHAT_KEY,Authorization:'Bearer '+CHAT_KEY,'Content-Type':'application/json',Accept:'application/json'});
  const store=()=>String(localStorage.getItem('mpkt_kode_toko')||'').trim().toUpperCase();
  const name=()=>String(localStorage.getItem('mpkt_nama_user')||localStorage.getItem('mpkt_pic')||localStorage.getItem('nama_user')||localStorage.getItem('pic_user')||'User').trim();
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const fmt=t=>{const d=new Date(t);return isNaN(d)?'':d.toLocaleString('id-ID',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});};
  function badge(n){const b=document.getElementById('chatBadge');if(!b)return;b.textContent=n>99?'99+':n;b.style.display=n?'block':'none';}
  function render(rows){
    const box=document.getElementById('chatMessages');if(!box)return;
    if(!rows.length){box.innerHTML='<div class="chat-empty">Belum ada pesan.<br>Jadilah yang pertama menyapa 👋</div>';return;}
    const me=name();box.innerHTML=rows.map(x=>{
      const mine=String(x.nama||'')===me;
      return '<div class="chat-row '+(mine?'mine':'')+'"><div class="chat-bubble"><div class="chat-name">'+esc(x.nama||'User')+'</div><div class="chat-text">'+esc(x.pesan||'')+'</div><div class="chat-time">'+fmt(x.created_at)+'</div></div></div>';
    }).join('');
    box.scrollTop=box.scrollHeight;
  }
  async function load(){
    const k=store();const label=document.getElementById('chatStoreLabel');if(label)label.textContent=k||'KODE TOKO BELUM ADA';
    if(!k)return;
    try{
      const url=CHAT_URL+'/'+CHAT_TABLE+'?kode_toko=eq.'+encodeURIComponent(k)+'&select=id,kode_toko,nama,pesan,created_at&order=created_at.asc&limit=200';
      const r=await fetch(url,{headers:headers(),cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status+' - '+await r.text());
      const rows=await r.json();const ids=rows.map(x=>x.id).join(',');
      if(ids!==lastChatIds || chatOpen){render(rows);lastChatIds=ids;}
      badge(0);
    }catch(e){console.warn('Chat Global:',e);const box=document.getElementById('chatMessages');if(box)box.innerHTML='<div class="chat-empty">Gagal memuat chat.<br><small>'+esc(e.message)+'</small></div>';}
  }
  async function send(){
    const input=document.getElementById('chatInput'),btn=document.getElementById('chatSend');const k=store(),msg=(input.value||'').trim();
    if(!k){alert('Kode toko belum tersedia. Isi kode toko di Monitoring SO Partial terlebih dahulu.');return;}
    if(!msg)return;btn.disabled=true;
    try{
      const r=await fetch(CHAT_URL+'/'+CHAT_TABLE,{method:'POST',headers:{...headers(),Prefer:'return=representation'},body:JSON.stringify({kode_toko:k,nama:name(),pesan:msg})});
      if(!r.ok)throw new Error('HTTP '+r.status+' - '+await r.text());input.value='';await load();input.focus();
    }catch(e){alert('Pesan gagal dikirim.\n\n'+e.message);}finally{btn.disabled=false;}
  }
  window.bukaChatGlobal=function(){
    chatOpen=true;document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));document.querySelector('.chat-nav')?.classList.add('active');document.getElementById('chatScreen').classList.add('active');
    // Close viewer so chat is the only active surface.
    try{tutupApp();}catch(e){}
    load();clearInterval(chatTimer);chatTimer=setInterval(()=>{if(chatOpen)load();},5000);
    setTimeout(()=>document.getElementById('chatInput')?.focus(),120);
  };
  window.tutupChatGlobal=function(){chatOpen=false;document.getElementById('chatScreen').classList.remove('active');clearInterval(chatTimer);};
  document.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('chatSend')?.addEventListener('click',send);
    document.getElementById('chatInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send();}});
  });
})();
</script>
